version: "3.8"

services:
  # Database Service — Production MariaDB
  db:
    image: "${MARIADB_IMAGE:-mariadb:10.6}"
    restart: unless-stopped
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--skip-character-set-client-handshake"
      - "--skip-innodb-read-only-compressed"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--password=${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Combined Redis Cache & Queue Service
  # Password required (2026-11): before this, anyone on the Docker network
  # could read/write the cache and job queues without auth. REDIS_PASSWORD
  # must be set in Coolify (hex only, e.g. `openssl rand -hex 32`); the
  # deploy fails fast if it is missing.
  # Pinned to an exact 6.2 patch (frappe_docker still ships 6.2 for v15/v16;
  # staying on 6.2 keeps the RDB file readable on rollback).
  redis:
    image: "${REDIS_IMAGE:-redis:6.2.24-alpine}"
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in Coolify}"]
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in Coolify}"
    volumes:
      - redis-data:/data
    healthcheck:
      # redis-cli authenticates via REDISCLI_AUTH; without it PING gets NOAUTH.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Python backend (Gunicorn) service + Configurator & Site Setup
  backend:
    image: "${FRAPPE_IMAGE:-frappe/erpnext}:${FRAPPE_VERSION:-v15.124.5}"
    restart: unless-stopped
    entrypoint: ["bash", "-c"]
    command:
      - |
        echo "=== Phase 1: Bench configuration ==="
        cd /home/frappe/frappe-bench
        # Redis requires a password (2026-11). Written first, because bench
        # get-app / bench build below already talk to redis. Plain json, not
        # `bench set-config`: bench cannot load yet (apps.txt lists hrms, which
        # code-sync removed from env until get-app re-installs it). Rewritten
        # on every start, so rotating REDIS_PASSWORD in Coolify + redeploy
        # updates all services. URL-safe characters only (it is in a URL).
        case "$$REDIS_PASSWORD" in
          ""|*[!A-Za-z0-9._~-]*)
            echo "FATAL: REDIS_PASSWORD is empty or not URL-safe (use: openssl rand -hex 32)."
            exit 1 ;;
        esac
        mkdir -p sites
        env/bin/python -c '
        import json, os
        p = "sites/common_site_config.json"
        c = json.load(open(p)) if os.path.exists(p) else {}
        pw = os.environ["REDIS_PASSWORD"]
        c["redis_cache"] = "redis://:%s@%s" % (pw, os.environ["REDIS_CACHE"])
        c["redis_queue"] = "redis://:%s@%s" % (pw, os.environ["REDIS_QUEUE"])
        c["redis_socketio"] = c["redis_queue"]
        json.dump(c, open(p + ".tmp", "w"), indent=1, sort_keys=True)
        os.replace(p + ".tmp", p)
        ' || { echo "FATAL: could not write redis URLs to common_site_config.json"; exit 1; }
        echo "Redis URLs (with password) written to common_site_config.json"

        # Always reinstall from upstream v15 (clean slate, v15-compatible).
        # Pinned to a reviewed release tag instead of the moving version-15
        # branch, so a new upstream commit cannot change production on restart
        # (Strix 2026-11, L1). To upgrade: pick a newer v15.x.y tag, review it,
        # update both values below. v15.64.8 == version-15 HEAD on 2026-11-09.
        HRMS_UPSTREAM_REF=v15.64.8
        HRMS_UPSTREAM_SHA=186900a6e3db4e6f927f1ee20df745bbb082638a
        rm -rf apps/hrms
        echo "Fetching hrms app (upstream $$HRMS_UPSTREAM_REF)..."
        bench get-app hrms https://github.com/frappe/hrms.git --branch $$HRMS_UPSTREAM_REF
        HRMS_ACTUAL_SHA=$$(git -C apps/hrms rev-parse HEAD 2>/dev/null)
        # Fail closed (Strix 2026-11, L1): the security patches are anchored on
        # this exact upstream text, so never start on unreviewed upstream code.
        if [ "$$HRMS_ACTUAL_SHA" != "$$HRMS_UPSTREAM_SHA" ]; then
          echo "FATAL: apps/hrms is at '$$HRMS_ACTUAL_SHA', expected $$HRMS_UPSTREAM_SHA ($$HRMS_UPSTREAM_REF). Upstream tag moved or clone failed - refusing to start."
          exit 1
        fi
        # Take TREEO customizations from git, not the bind mount. Coolify only
        # places the compose file on the server — ./docker/assets is NOT synced
        # from the repo (DEPLOY_FIXES.md #13), so anything that relies on the
        # bind mount silently disappears whenever that directory is cleared.
        # Falls back to the bind mount if the clone fails, so a GitHub outage
        # degrades to the old behaviour instead of breaking the deploy.
        ASSETS=/home/frappe/custom-assets
        FORK_ROOT=""
        rm -rf /tmp/treeo-fork
        # Fork assets are pinned to a reviewed commit (Strix 2026-11, L1), so a
        # push to miqbalf/hrms main no longer changes production on restart.
        # TO BUMP THE PIN (DEPLOY_FIXES.md #19): commit + push the docker/assets
        # change to develop, wait for the GitLab->GitHub mirror, review that
        # commit, put its full 40-char SHA below, then merge develop to main.
        # The pinned commit must be reachable from a branch on the fork.
        TREEO_FORK_SHA=075f09ab5ce4b22b2487e1004c9b217f6bb9a7b6
        mkdir -p /tmp/treeo-fork && git init -q /tmp/treeo-fork
        if GIT_TERMINAL_PROMPT=0 git -C /tmp/treeo-fork fetch -q --depth 1 \
             https://github.com/miqbalf/hrms.git $$TREEO_FORK_SHA \
           && git -C /tmp/treeo-fork checkout -q FETCH_HEAD; then
          FORK_ROOT=/tmp/treeo-fork
          ASSETS=/tmp/treeo-fork/docker/assets
          TREEO_FORK_ACTUAL=$$(git -C /tmp/treeo-fork rev-parse HEAD 2>/dev/null)
          echo "TREEO customizations source: git ($$ASSETS) at $$TREEO_FORK_ACTUAL"
          if [ "$$TREEO_FORK_ACTUAL" != "$$TREEO_FORK_SHA" ]; then
            echo "WARNING: TREEO fork is at '$$TREEO_FORK_ACTUAL', expected pin $$TREEO_FORK_SHA - review!"
          fi
        else
          echo "WARNING: could not fetch TREEO fork at pin $$TREEO_FORK_SHA — falling back to bind mount $$ASSETS"
        fi
        # Inject TREEO custom functions
        mkdir -p apps/hrms/hrms/utils
        if [ -f $$ASSETS/treeo_branding.py ]; then
          cp $$ASSETS/treeo_branding.py apps/hrms/hrms/utils/treeo_branding.py
        fi
        # Ensure apply_branding is importable from hrms.utils
        if ! grep -q "apply_branding" apps/hrms/hrms/utils/__init__.py 2>/dev/null; then
          echo "" >> apps/hrms/hrms/utils/__init__.py
          echo "from hrms.utils.treeo_branding import apply_branding, is_half_holiday" >> apps/hrms/hrms/utils/__init__.py
        fi
        # Inject cancelled-document email print fix (skip print attach so email can send)
        if [ -f $$ASSETS/inject_email_queue_fix.sh ]; then
          bash $$ASSETS/inject_email_queue_fix.sh $$ASSETS
        fi
        # Inject Google Calendar sync for approved leaves (doc_events + hourly sweep)
        if [ -f $$ASSETS/inject_calendar_sync.sh ]; then
          bash $$ASSETS/inject_calendar_sync.sh $$FORK_ROOT
        fi
        # Security hardening (Strix 2026-11): permission checks and a bounded
        # calendar range patched into upstream code. Idempotent; a missing
        # anchor only logs a WARNING, it never stops the container.
        if [ -f $$ASSETS/inject_security_patches.sh ]; then
          bash $$ASSETS/inject_security_patches.sh apps/hrms || echo "WARNING: security patch injection failed; continuing."
        else
          echo "WARNING: inject_security_patches.sh not found in $$ASSETS - security patches NOT applied."
        fi
        echo "Building assets..."
        # Remove any previous assets so bench build can create clean symlinks.
        # On the first deploy sites/assets is a bench-created symlink; on
        # subsequent deploys it's a real directory from the copy below.
        # bench build can't create symlinks when a directory already exists.
        rm -rf sites/assets
        bench build || true
        # bench build makes sites/assets a symlink to the bench-level assets
        # dir. The frontend nginx only shares the sites volume, so copy the
        # dereferenced content as real files onto the shared volume.
        echo "Moving assets to shared volume..."
        cp -rL sites/assets/ /tmp/assets-content
        rm -rf sites/assets
        mv /tmp/assets-content sites/assets
        # Replace default FrappeHR app icon with TREEO circle icon
        mkdir -p sites/assets/hrms/images
        cp $$ASSETS/frappe-hr-logo.svg sites/assets/hrms/images/frappe-hr-logo.svg 2>/dev/null || true
        echo "TREEO icon applied to FrappeHR app."
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host $$DB_HOST
        bench set-config -gp db_port $$DB_PORT
        # (redis_cache / redis_queue / redis_socketio are set at the top of Phase 1.)
        bench set-config -gp socketio_port $$SOCKETIO_PORT
        # Email flush "All" jobs use minute cron from scheduler_interval (min practical: 60s).
        # Tick at 30s so due jobs are picked up quickly; instant send also wired in EmailQueue override.
        bench set-config -gp scheduler_interval 60
        bench set-config -gp scheduler_tick_interval 30

        apply_smtp_config() {
          if [ -z "$$SMTP_HOST" ]; then
            echo "SMTP_HOST not set — skipping email configuration."
            return 0
          fi
          echo "Applying SMTP configuration for $$SITE_NAME..."
          bench --site $$SITE_NAME set-config mail_server       "$$SMTP_HOST"
          bench --site $$SITE_NAME set-config mail_login        "$$SMTP_LOGIN"
          bench --site $$SITE_NAME set-config mail_password     "$$SMTP_PASSWORD"
          bench --site $$SITE_NAME set-config -p mail_port      $$SMTP_PORT
          bench --site $$SITE_NAME set-config -p use_tls        $$SMTP_USE_TLS
          bench --site $$SITE_NAME set-config -p use_ssl        $$SMTP_USE_SSL
          bench --site $$SITE_NAME set-config auto_email_id     "$$SMTP_FROM_EMAIL"
          bench --site $$SITE_NAME set-config email_sender_name "$$SMTP_FROM_NAME"
          echo "SMTP configuration applied."
        }

        echo "=== Phase 2: Service availability checks ==="
        wait-for-it -t 120 db:3306
        wait-for-it -t 120 redis:6379

        echo "=== Phase 3: Site creation or migration ==="
        if [ ! -d "sites/$$SITE_NAME" ]; then
          echo "Creating new site $$SITE_NAME..."
          bench new-site $$SITE_NAME \
            --no-mariadb-socket \
            --admin-password "$$ADMIN_PASSWORD" \
            --db-root-username root \
            --db-root-password "$$DB_ROOT_PASSWORD" \
            --mariadb-user-host-login-scope '%' \
            --install-app erpnext \
            --set-default

          echo "Installing hrms app on $$SITE_NAME..."
          bench --site $$SITE_NAME install-app hrms

          apply_smtp_config

          echo "Applying TREEO branding & taglines..."
          bench --site $$SITE_NAME set-config app_title "TREEO HR system"
          bench --site $$SITE_NAME set-config app_description "TREEO HR system - Empowering People, Restoring Nature"
          bench --site $$SITE_NAME enable-scheduler
          bench --site $$SITE_NAME execute hrms.utils.apply_branding || echo "Branding apply failed (non-fatal)"
          bench --site $$SITE_NAME execute hrms.hr.doctype.leave_application.leave_calendar_sync.ensure_custom_fields || echo "Calendar sync fields failed (non-fatal)"
          # No tracebacks in API error responses (Strix 2026-11): v15 sends the
          # full traceback as "exc" to anyone, guests included, while this is on.
          bench --site $$SITE_NAME execute frappe.db.set_single_value --args "['System Settings', 'allow_error_traceback', 0]" \
            && echo "System Settings: allow_error_traceback = 0" \
            || echo "SECURITY WARNING: could not turn off allow_error_traceback"

          mkdir -p sites/$$SITE_NAME/public/files
          cp $$ASSETS/treeo_logo.png sites/$$SITE_NAME/public/files/treeo_logo.png 2>/dev/null || true
          cp $$ASSETS/favicon.png    sites/$$SITE_NAME/public/files/favicon.png 2>/dev/null || true
          echo "Site $$SITE_NAME initialized successfully!"
        else
          echo "Site $$SITE_NAME already exists. Running migration..."
          bench --site $$SITE_NAME migrate
          apply_smtp_config
          mkdir -p sites/$$SITE_NAME/public/files
          cp $$ASSETS/treeo_logo.png sites/$$SITE_NAME/public/files/treeo_logo.png 2>/dev/null || true
          cp $$ASSETS/favicon.png    sites/$$SITE_NAME/public/files/favicon.png 2>/dev/null || true
          bench --site $$SITE_NAME execute hrms.utils.apply_branding || echo "Branding apply failed (non-fatal)"
          bench --site $$SITE_NAME execute hrms.hr.doctype.leave_application.leave_calendar_sync.ensure_custom_fields || echo "Calendar sync fields failed (non-fatal)"
          # No tracebacks in API error responses (Strix 2026-11): v15 sends the
          # full traceback as "exc" to anyone, guests included, while this is on.
          bench --site $$SITE_NAME execute frappe.db.set_single_value --args "['System Settings', 'allow_error_traceback', 0]" \
            && echo "System Settings: allow_error_traceback = 0" \
            || echo "SECURITY WARNING: could not turn off allow_error_traceback"
          echo "Branding re-applied to existing site."
        fi

        echo "=== Phase 4: Start Gunicorn backend ==="
        exec /home/frappe/frappe-bench/env/bin/gunicorn \
          --chdir=/home/frappe/frappe-bench/sites \
          --bind=0.0.0.0:8000 \
          --threads=4 \
          --workers=1 \
          --worker-class=gthread \
          --worker-tmp-dir=/dev/shm \
          --timeout=120 \
          --preload \
          frappe.app:application
    environment:
      FRAPPE_SITE_NAME_HEADER: "${SITE_NAME:-hr.treeo.id}"
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis:6379
      REDIS_QUEUE: redis:6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in Coolify}"
      SOCKETIO_PORT: "9000"
      SITE_NAME: "${SITE_NAME:-hr.treeo.id}"
      DB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      # SMTP (all optional — skipped when SMTP_HOST is empty)
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_LOGIN: "${SMTP_LOGIN:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-1}"
      SMTP_USE_SSL: "${SMTP_USE_SSL:-0}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-TREEO HR System}"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./docker/assets:/home/frappe/custom-assets:ro
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env
    depends_on:
      code-sync:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Real-time websocket notifications
  websocket:
    image: "${FRAPPE_IMAGE:-frappe/erpnext}:${FRAPPE_VERSION:-v15.124.5}"
    restart: unless-stopped
    entrypoint: ["bash", "-c"]
    command:
      - |
        echo "Waiting for site config..."
        until [ -f sites/common_site_config.json ]; do sleep 2; done
        # Wait until backend has finished setup (redis password written to
        # config, hrms installed, migrate done) so we never start on stale
        # config or code. Gunicorn binds :8000 only after all of that.
        wait-for-it -t 0 backend:8000
        echo "Site config ready! Starting websocket server..."
        exec node /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env
    depends_on:
      backend:
        condition: service_started

  # Frontend Nginx proxy serving static assets
  frontend:
    image: "${FRAPPE_IMAGE:-frappe/erpnext}:${FRAPPE_VERSION:-v15.124.5}"
    restart: unless-stopped
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 300
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frappe-hr-router.rule=Host(`hr.treeo.id`)"
      - "traefik.http.routers.frappe-hr-router.entryPoints=https"
      - "traefik.http.routers.frappe-hr-router.tls=true"
      - "traefik.http.routers.frappe-hr-router.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"

  # Scheduler for background crons
  scheduler:
    image: "${FRAPPE_IMAGE:-frappe/erpnext}:${FRAPPE_VERSION:-v15.124.5}"
    restart: unless-stopped
    entrypoint: ["bash", "-c"]
    command:
      - |
        echo "Waiting for site config..."
        until [ -f "sites/$$SITE_NAME/site_config.json" ]; do sleep 5; done
        wait-for-it -t 0 backend:8000
        echo "Site ready! Starting scheduler..."
        exec bench schedule
    environment:
      SITE_NAME: "${SITE_NAME:-hr.treeo.id}"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env
    depends_on:
      backend:
        condition: service_started

  # Single Combined Queue Worker (Default, Short, Long)
  worker:
    image: "${FRAPPE_IMAGE:-frappe/erpnext}:${FRAPPE_VERSION:-v15.124.5}"
    restart: unless-stopped
    entrypoint: ["bash", "-c"]
    command:
      - |
        echo "Waiting for site config..."
        until [ -f "sites/$$SITE_NAME/site_config.json" ]; do sleep 5; done
        wait-for-it -t 0 backend:8000
        echo "Site ready! Starting worker..."
        exec bench worker --queue short,default,long
    environment:
      SITE_NAME: "${SITE_NAME:-hr.treeo.id}"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env
    depends_on:
      backend:
        condition: service_started

  # Refresh frappe/erpnext code and the Python env from the image (2026-11).
  # The `apps` and `env` named volumes are shared by backend, websocket,
  # scheduler and worker (they all need the hrms app the backend installs).
  # Docker only fills a named volume from the image while it is empty, so an
  # image update never reached the code: prod stayed on frappe/erpnext
  # 15.112.0 while the image moved on. This one-shot service copies the
  # image's apps/frappe, apps/erpnext and env into the volumes on every
  # deploy, before backend starts; backend then re-installs hrms into env
  # (bench get-app) and runs `bench migrate`. apps/hrms is left to backend.
  code-sync:
    image: "${FRAPPE_IMAGE:-frappe/erpnext}:${FRAPPE_VERSION:-v15.124.5}"
    restart: "no"
    exclude_from_hc: true
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        BENCH=/home/frappe/frappe-bench
        for app in frappe erpnext; do
          echo "code-sync: refreshing apps/$$app from image..."
          rm -rf "/mnt/apps/$$app.new"
          cp -a "$$BENCH/apps/$$app" "/mnt/apps/$$app.new"
          rm -rf "/mnt/apps/$$app"
          mv "/mnt/apps/$$app.new" "/mnt/apps/$$app"
        done
        echo "code-sync: refreshing env from image (backend re-installs hrms)..."
        find /mnt/env -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        cp -a "$$BENCH/env/." /mnt/env/
        echo "code-sync: done; image has frappe $$(grep -m1 __version__ $$BENCH/apps/frappe/frappe/__init__.py), erpnext $$(grep -m1 __version__ $$BENCH/apps/erpnext/erpnext/__init__.py)"
    volumes:
      - apps:/mnt/apps
      - env:/mnt/env

volumes:
  db-data:
  redis-data:
  sites:
  logs:
  apps:
  env:
